name: GoreeCloud AI Platform Contract

on:
  pull_request:
    paths:
      - 'goreecloud.platform.yaml'
      - 'PRIVACY POLICY.md'
      - 'SECURITY.md'
      - 'NOTES.md'
      - 'FEATURE-ROADMAP.md'
      - '.github/workflows/platform-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'goreecloud.platform.yaml'
      - 'PRIVACY POLICY.md'
      - 'SECURITY.md'
      - 'NOTES.md'
      - 'FEATURE-ROADMAP.md'
      - '.github/workflows/platform-contract.yml'

permissions:
  contents: read

jobs:
  platform-contract:
    # Pin validation to the accepted central Platform Contract 0.4 nine-system
    # implementation. Exact revision provenance is intentional; do not follow
    # a moving central branch for conformance validation.
    uses: GoreeCloud/GoreeCloud/.github/workflows/reusable-platform-manifest.yml@6cb150d512647a0401b4da9e4741d7591693dee0
    with:
      manifest-path: goreecloud.platform.yaml
